name: Logger cron

# MANUAL BACKSTOP ONLY (workflow_dispatch). Settles predictions + writes actuals (incl.
# the new pred.actualLow that revives the LOW calibration loop). Scheduling is Netlify's
# job (netlify.toml, */5); GitHub Actions can't hold a sub-hourly cadence, so no `schedule:`
# here. Fire on demand to force a settle pass (e.g. to seed actualLow after deploy).
on:
  workflow_dispatch: {}

concurrency:
  group: logger
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit logger
        env:
          BASIC_AUTH: ${{ secrets.WEATHERBOT_BASIC_AUTH }}
        run: |
          curl --max-time 290 -sS -u "$BASIC_AUTH" -X POST \
            "https://weatherbot-mf.netlify.app/.netlify/functions/logger" \
            -o /tmp/logger.json -w "HTTP %{http_code}\n" || true
          jq '{ok, settled, updated}' /tmp/logger.json 2>/dev/null \
            || echo "(non-JSON response — likely a Netlify timeout; next cycle retries)"
