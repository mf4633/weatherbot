name: Floor sweep cron

# Capture the MORNING mispricing window for the low-tail-NO strategy. /api/floorsweep
# logs the top floor pick per city (first-per-day wins), so it must run early and often
# across US mornings — a west-coast board and an east-coast board have their cheap-floor
# windows hours apart. Netlify's scheduler stalls (documented, cf. the claude-logger
# outage), so this is the external backstop that actually captures the picks the
# ?mode=report scorer later grades against CLI settlement.

on:
  schedule:
    # Minute :23, NOT :00 — GitHub delays/drops top-of-hour schedules under load (its
    # own docs), which is why the :00 version logged 0 runs in 13h while the :15 logger
    # cron fired. Hourly across the US-morning window so every city's cheap-floor window
    # (east-coast ~12-15Z, west-coast ~14-17Z) gets a capture.
    - cron: "23 11,12,13,14,15,16,17,18 * * *"
  workflow_dispatch: {}

concurrency:
  group: floorsweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run floor sweep (logs the morning picks)
        env:
          BASIC_AUTH: ${{ secrets.WEATHERBOT_BASIC_AUTH }}
        run: |
          code=$(curl --max-time 150 -sS -u "$BASIC_AUTH" \
            "https://weatherbot-mf.netlify.app/api/floorsweep" \
            -o /tmp/sweep.json -w "%{http_code}" || echo "000")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::floorsweep did not return 200 (HTTP $code)"
            head -c 800 /tmp/sweep.json || true
            exit 0
          fi
          # Dump the full actionable result to the log (this IS the readable output).
          echo "=== FLOOR SWEEP $(date -u +%FT%TZ) ==="
          jq -r '"logged=\(.logged)  candidates=\(.best_low_tail_no|length)  tailwinds=\(.tailwind_cities|join(",") // "none")"' /tmp/sweep.json || true
          echo "--- best_low_tail_no (ranked buy-list) ---"
          jq -r '(.best_low_tail_no[] | "\(.city)  \(.label)  NO=\(.no_ask)  return=\(.return_pct)%  p_lock=\(.p_lock)  deg->lock=\(.deg_to_lock)  locked=\(.already_locked)") // empty' /tmp/sweep.json || true
          echo "--- tailwind cities (cold-pool, lean in) ---"
          jq -r '(.cities[] | select(.floor_tailwind==true) | "\(.city)  predicted=\(.predicted)  anomaly=\(.anchor_anomaly_f)  \(.tailwind_note // "")") // empty' /tmp/sweep.json || true
          echo "--- failed (fix ticker in CITIES) ---"
          jq -r '(.failed[] | "\(.city): \(.error)") // empty' /tmp/sweep.json || true
          echo "--- per-city ---"
          jq -r '.cities[] | "\(.city) ok=\(.ok) predicted=\(.predicted // "-") maxSoFar=\(.max_so_far // "-") tailwind=\(.floor_tailwind // "-") cands=\(.candidates|length)"' /tmp/sweep.json || true
