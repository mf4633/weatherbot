<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="weatherbot logo">
  <!-- sun antenna -->
  <g stroke="#ffd166" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="32" y1="2" x2="32" y2="6"/>
    <line x1="24" y1="5" x2="26" y2="8"/>
    <line x1="40" y1="5" x2="38" y2="8"/>
  </g>
  <line x1="32" y1="10" x2="32" y2="16" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="9" r="3" fill="#ffd166"/>

  <!-- head -->
  <rect x="10" y="16" width="44" height="36" rx="10" ry="10"
        fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>

  <!-- face screen -->
  <rect x="15" y="22" width="34" height="22" rx="3" fill="#0d1117"/>

  <!-- eyes (LED dots) -->
  <circle cx="24" cy="30" r="2.8" fill="#79c0ff"/>
  <circle cx="40" cy="30" r="2.8" fill="#79c0ff"/>
  <circle cx="24.7" cy="29.3" r="0.9" fill="#e6edf3"/>
  <circle cx="40.7" cy="29.3" r="0.9" fill="#e6edf3"/>

  <!-- smile -->
  <path d="M 23 37 Q 32 42 41 37" stroke="#3fb950" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <!-- little cloud puffs flanking the head -->
  <g fill="#c9d1d9" opacity="0.85">
    <circle cx="7"  cy="44" r="3.5"/>
    <circle cx="11" cy="46" r="2.5"/>
    <circle cx="57" cy="44" r="3.5"/>
    <circle cx="53" cy="46" r="2.5"/>
  </g>

  <!-- raindrop -->
  <path d="M 32 56 Q 30 60 32 62 Q 34 60 32 56 Z" fill="#79c0ff"/>
</svg>
