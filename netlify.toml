[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."jackson_trader"]
  schedule = "*/5 * * * *"

[functions."jackson_react"]
  schedule = "*/1 * * * *"

[functions."jackson_rain_trader"]
  schedule = "7,37 * * * *"

[functions."logger"]
  schedule = "*/5 * * * *"

[functions."combo_trader"]
  schedule = "*/30 * * * *"

[functions."balance_snapshot"]
  schedule = "0 0 * * *"

[[edge_functions]]
  path = "/*"
  function = "auth"

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200

