[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "auth"

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200

[[redirects]]
  from = "/api/residuals"
  to = "/.netlify/functions/residuals"
  status = 200

[[redirects]]
  from = "/api/kalshi"
  to = "/.netlify/functions/kalshi"
  status = 200

[[redirects]]
  from = "/api/paper"
  to = "/.netlify/functions/paper"
  status = 200

[[redirects]]
  from = "/api/jackson"
  to = "/.netlify/functions/jackson"
  status = 200
