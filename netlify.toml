[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# jackson_trader is scheduled by GitHub Actions (.github/workflows/jackson-trader-cron.yml),
# NOT here. Netlify's scheduled-function cron was firing it only every few hours (2026-06-02),
# and a single scheduler avoids double-fire (two concurrent runs double-placing a bet).

[functions."jackson_react"]
  schedule = "*/1 * * * *"

[functions."jackson_rain_trader"]
  schedule = "7,37 * * * *"

[functions."logger"]
  schedule = "*/5 * * * *"

[functions."combo_trader"]
  schedule = "*/30 * * * *"

[functions."balance_snapshot"]
  schedule = "0 0 * * *"

[functions."combo_balance_snapshot"]
  schedule = "0 0 * * *"

[functions."calibration_update"]
  schedule = "*/30 * * * *"

[functions."pwin_calibration_fit"]
  schedule = "*/30 * * * *"

[[edge_functions]]
  path = "/*"
  function = "auth"

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200

