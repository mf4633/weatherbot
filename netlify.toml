[build]
  publish = "."
  # Emits _build_stamp.json (served statically, since publish = ".") so the health cron
  # can see WHICH commit is actually serving. A failed build otherwise leaves the previous
  # deploy answering 200 on everything — invisible from outside. The script is wrapped and
  # force-exits 0, so it cannot fail a deploy; see scripts/write_build_stamp.js.
  command = "node scripts/write_build_stamp.js || true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."jackson_trader"]
  schedule = "*/5 * * * *"

# Paper shadow trader — faithful $100 virtual mirror of jackson_trader's entry
# engine. HTTP-triggered (Netlify schedules are throttled here); jackson_trader's
# default export kicks /api/paper_trader every cycle off the reliable cron-job.org
# trigger. Route below; no schedule. Seed via /api/paper_reset.

# 2026-06-02: cut scheduled-function load to test whether Netlify's cron throttling
# (firing */5 fns only every few hours) is invocation-budget driven. jackson_react was
# */1 (~1440/day, ~65% of all scheduled fires) — by far the biggest hog. At */5 it's a
# redundant backstop to jackson_trader's own */5 sell loop (its fast-sell value was
# already dead under the throttle anyway). Drop to */3 instead of */5 if fast-sell needs
# restoring once the scheduler is healthy.
[functions."jackson_react"]
  schedule = "*/5 * * * *"

[functions."jackson_rain_trader"]
  schedule = "7,37 * * * *"

[functions."logger"]
  schedule = "*/5 * * * *"

# Shadow market-data logger (STRATEGY.md Step 0). Records the full Kalshi book + obs
# every 15 min; places NO trades. Settle/export are triggered out-of-band via the route
# below (external cron or manual): ?mode=settle joins CLI outcomes, ?mode=export emits the
# eval_strategy.mjs dataset.
[functions."market_logger"]
  schedule = "*/15 * * * *"

# Claude obs-analog engine (/api/claude). Default mode logs a Claude/Bayes/Market
# decision per city to the verification scoreboard; ?mode=settle joins CLI outcomes,
# ?mode=scoreboard scores. Places no trades. Hourly logging is plenty (obs move slowly).
[functions."claude"]
  schedule = "0 * * * *"

# combo is a paper-only meta-strategy — hourly is plenty (was */30).
[functions."combo_trader"]
  schedule = "0 * * * *"

# balance_snapshot + combo_balance_snapshot run daily via GitHub Actions
# (.github/workflows/{balance,combo}-snapshot-cron.yml), so their Netlify schedules
# were redundant and are removed here. The functions stay HTTP-invocable.

# calibration_update is now a BACKGROUND function (calibration_update-background.js):
# the synchronous 10s HTTP limit timed it out (store.list + load + compute + write),
# which is why it only ever ran under the throttled scheduler. Background functions get
# 15 min and return 202, so the external cron (GitHub Actions / cron-job.org) can trigger
# it reliably. No Netlify schedule — cron-driven. See 2026-06-04 commit.

# pWin calibration drifts slowly — hourly is enough (was */30).
[functions."pwin_calibration_fit"]
  schedule = "0 * * * *"

