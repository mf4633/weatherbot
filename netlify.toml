# HTTP route so the external cron (GitHub Actions) can trigger calibration_update —
# Netlify's own */30 scheduler is throttled and was leaving calibration_state stale,
# tripping the trader's cal-stale gate and halting the bot. Added 2026-06-04.
[[redirects]]
  from = "/api/calibration_update"
  to = "/.netlify/functions/calibration_update-background"
  status = 200

# HTTP route for the tolerant σ-revision/intraday-β refit background fn (2026-06-08).
# logger's inline refit is disabled (INLINE_REFIT=false) because it 502s on the 10s sync
# limit; this -background fn (15-min, 202) runs it reliably. Trader self-kicks it hourly
# (gated to start after 2026-06-13). ?dryRun=1 verifies without writing live σ.
[[redirects]]
  from = "/api/sigma_refit"
  to = "/.netlify/functions/sigma_refit-background"
  status = 200

[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshots"
  status = 200

[[redirects]]
